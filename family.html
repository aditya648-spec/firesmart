<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Family Members - Smart Fire Guardian</title>


  <!-- Main Website Style -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    .family-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 18px 50px;
    }


    .family-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }


    .family-title {
      font-size: 28px;
      font-weight: 700;
    }


    .family-subtitle {
      margin-top: 5px;
      opacity: 0.7;
    }


    .back-button {
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      display: inline-block;
    }


    .family-form-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }


    .family-form-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
    }


    .form-group {
      margin-bottom: 15px;
    }


    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }


    .form-group input,
    .form-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }


    .location-box {
      border: 1px dashed #9ca3af;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 15px;
    }


    #locationStatus,
    #homeLocationStatus {
      font-size: 14px;
      margin-bottom: 10px;
    }


    .family-button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-right: 8px;
      margin-bottom: 8px;
    }


    #selectLocation,
    #selectHomeLocation {
      background: #e5e7eb;
      color: #111827;
    }


    #saveFamilyMember,
    #saveMember {
      background: #0f172a;
      color: white;
    }


    #cancelEdit {
      background: #e5e7eb;
      color: #111827;
    }


    .members-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }


    .members-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
    }


    .family-member-card {
      background: #f8fafc;
    }


    @media (max-width: 600px) {

      .family-page {
        padding: 18px 12px 40px;
      }

      .family-title {
        font-size: 23px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       TOP BAR
       ===================================================== -->

  <header class="topbar">

    <div class="brand-area">

      <div class="brand-icon">
        🔥
      </div>


      <div>

        <div class="brand-title">
          Smart Fire Guardian
        </div>


        <div class="brand-subtitle">
          Family Emergency Management
        </div>

      </div>

    </div>

  </header>



  <!-- =====================================================
       FAMILY PAGE
       ===================================================== -->

  <main class="family-page">


    <!-- HEADER -->

    <div class="family-header">

      <div>

        <div class="family-title">
          👨‍👩‍👧 Family Members
        </div>


        <div class="family-subtitle">
          Add family contacts and their home locations
        </div>

      </div>


      <a
        href="index.html"
        class="back-button"
      >
        ← Dashboard
      </a>

    </div>



    <!-- ===================================================
         ADD FAMILY MEMBER
         =================================================== -->

    <section class="family-form-card">


      <div class="family-form-title">
        Add Family Member
      </div>



      <form id="familyForm">


        <!-- NAME -->

        <div class="form-group">

          <label for="name">
            Name
          </label>


          <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter name"
            required
          >

        </div>



        <!-- RELATION -->

        <div class="form-group">

          <label for="relation">
            Relationship
          </label>


          <select
            id="relation"
            name="relation"
          >

            <option value="">
              Select relationship
            </option>

            <option value="Father">
              Father
            </option>

            <option value="Mother">
              Mother
            </option>

            <option value="Brother">
              Brother
            </option>

            <option value="Sister">
              Sister
            </option>

            <option value="Son">
              Son
            </option>

            <option value="Daughter">
              Daughter
            </option>

            <option value="Husband">
              Husband
            </option>

            <option value="Wife">
              Wife
            </option>

            <option value="Grandfather">
              Grandfather
            </option>

            <option value="Grandmother">
              Grandmother
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>



        <!-- PHONE -->

        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>


          <input
            id="phone"
            name="phone"
            type="tel"
            placeholder="Enter phone number"
            required
          >

        </div>



        <!-- HOME LOCATION -->

        <div class="location-box">


          <strong>
            🏠 Home Location
          </strong>


          <div
            id="locationStatus"
          >
            No home location selected
          </div>


          <button
            id="selectLocation"
            class="family-button"
            type="button"
          >
            🗺️ Select Home Location
          </button>


        </div>



        <!-- SAVE -->

        <button
          id="saveFamilyMember"
          class="family-button"
          type="submit"
        >
          Save Family Member
        </button>


        <!-- CANCEL EDIT -->

        <button
          id="cancelEdit"
          class="family-button"
          type="button"
          style="display:none;"
        >
          Cancel Edit
        </button>


      </form>

    </section>



    <!-- ===================================================
         REGISTERED MEMBERS
         =================================================== -->

    <section class="members-card">


      <div class="members-title">
        Registered Members
      </div>


      <div
        id="familyList"
      >

        Loading family members...

      </div>


    </section>


  </main>



  <!-- =====================================================
       LEAFLET
       ===================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>



  <!-- =====================================================
       FAMILY JAVASCRIPT
       ===================================================== -->

  <script
    type="module"
    src="family.js"
  ></script>


</body>

</html>
