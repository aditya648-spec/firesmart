<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Family Members • Smart Fire Guardian</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    .topbar {
      min-height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dc2626;
      font-size: 22px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: #cbd5e1;
    }

    .back-button {
      border: 1px solid #475569;
      background: transparent;
      color: white;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .container {
      width: min(900px, calc(100% - 30px));
      margin: 25px auto 40px;
    }

    .page-header {
      margin-bottom: 18px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 900;
    }

    .page-subtitle {
      margin-top: 5px;
      font-size: 12px;
      color: #64748b;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 850;
      color: #0f172a;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 11px;
      font-weight: 800;
      color: #475569;
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 13px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #64748b;
    }

    .location-box {
      padding: 13px;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
    }

    .location-status {
      font-size: 12px;
      color: #64748b;
    }

    .location-coordinates {
      margin-top: 5px;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .primary-button {
      background: #0f172a;
      color: white;
    }

    .secondary-button {
      background: #e2e8f0;
      color: #334155;
    }

    .danger-button {
      background: #fee2e2;
      color: #b91c1c;
    }

    .members {
      margin-top: 14px;
    }

    .member {
      padding: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .member:last-child {
      margin-bottom: 0;
    }

    .member-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .member-name {
      font-size: 15px;
      font-weight: 900;
    }

    .primary-badge {
      padding: 4px 7px;
      border-radius: 6px;
      background: #dcfce7;
      color: #166534;
      font-size: 9px;
      font-weight: 900;
    }

    .member-info {
      margin-top: 7px;
      display: grid;
      gap: 4px;
      font-size: 11px;
      color: #64748b;
    }

    .member-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .empty {
      padding: 25px;
      text-align: center;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 12px;
    }

    .message {
      margin-top: 12px;
      font-size: 11px;
      font-weight: 700;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 0 15px;
      }

      .container {
        width: calc(100% - 20px);
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .brand-subtitle {
        display: none;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      🔥
    </div>

    <div>
      <div class="brand-title">
        Smart Fire Guardian
      </div>

      <div class="brand-subtitle">
        Family Emergency System
      </div>
    </div>

  </div>

  <button
    class="back-button"
    onclick="window.location.href='index.html'"
  >
    ← Fire Monitor
  </button>

</header>


<main class="container">

  <div class="page-header">

    <div class="page-title">
      👨‍👩‍👧 Family Members
    </div>

    <div class="page-subtitle">
      Add emergency contacts and save their home locations.
    </div>

  </div>


  <!-- ADD MEMBER -->

  <section class="card">

    <div class="section-title">
      Add Family Member
    </div>

    <div class="form-grid">

      <div class="form-group">

        <label for="memberName">
          NAME
        </label>

        <input
          id="memberName"
          type="text"
          placeholder="Example: Dad"
        >

      </div>


      <div class="form-group">

        <label for="memberRelation">
          RELATIONSHIP
        </label>

        <select id="memberRelation">

          <option value="">
            Select relationship
          </option>

          <option value="Father">
            Father
          </option>

          <option value="Mother">
            Mother
          </option>

          <option value="Brother">
            Brother
          </option>

          <option value="Sister">
            Sister
          </option>

          <option value="Husband">
            Husband
          </option>

          <option value="Wife">
            Wife
          </option>

          <option value="Son">
            Son
          </option>

          <option value="Daughter">
            Daughter
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <div class="form-group full">

        <label for="memberPhone">
          PHONE NUMBER
        </label>

        <input
          id="memberPhone"
          type="tel"
          placeholder="+91 XXXXX XXXXX"
        >

      </div>


      <div class="form-group full">

        <label>
          HOME LOCATION
        </label>

        <div class="location-box">

          <div
            id="locationStatus"
            class="location-status"
          >
            No home location selected.
          </div>

          <div
            id="locationCoordinates"
            class="location-coordinates"
          >
          </div>

        </div>

      </div>

    </div>


    <div class="button-row">

      <button
        id="selectLocationButton"
        class="secondary-button"
        type="button"
      >
        📍 Select Home Location
      </button>

      <button
        id="saveMemberButton"
        class="primary-button"
        type="button"
      >
        Save Family Member
      </button>

    </div>


    <div
      id="formMessage"
      class="message"
    >
    </div>

  </section>


  <!-- FAMILY LIST -->

  <section class="card">

    <div class="section-title">
      Registered Family Members
    </div>

    <div
      id="membersList"
      class="members"
    >

      <div class="empty">
        Loading family members...
      </div>

    </div>

  </section>

</main>


<script type="module">

  import { db } from "./firebase-config.js";

  import {
    ref,
    push,
    set,
    onValue,
    remove
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  const DEVICE_ID = "SF-003";


  let selectedLatitude = null;
  let selectedLongitude = null;


  const nameInput =
    document.getElementById("memberName");

  const relationInput =
    document.getElementById("memberRelation");

  const phoneInput =
    document.getElementById("memberPhone");

  const locationStatus =
    document.getElementById("locationStatus");

  const locationCoordinates =
    document.getElementById("locationCoordinates");

  const formMessage =
    document.getElementById("formMessage");

  const membersList =
    document.getElementById("membersList");


  /*
    TEMPORARY location selection.

    For this first step, we use the browser's
    location permission.

    Later we will replace this with:
    "Tap Home Location on Map".
  */

  document
    .getElementById("selectLocationButton")
    .addEventListener(
      "click",
      () => {

        if (!navigator.geolocation) {

          formMessage.textContent =
            "Location is not supported by this browser.";

          formMessage.className =
            "message error";

          return;

        }


        locationStatus.textContent =
          "Getting current location...";


        navigator.geolocation.getCurrentPosition(

          (position) => {

            selectedLatitude =
              position.coords.latitude;

            selectedLongitude =
              position.coords.longitude;


            locationStatus.textContent =
              "Home location selected.";

            locationCoordinates.textContent =
              `Latitude: ${selectedLatitude.toFixed(6)}
               | Longitude: ${selectedLongitude.toFixed(6)}`;


            formMessage.textContent =
              "Home location selected successfully.";

            formMessage.className =
              "message success";

          },

          (error) => {

            console.error(
              "Location error:",
              error
            );


            locationStatus.textContent =
              "Could not get location.";

            formMessage.textContent =
              "Please allow location permission.";

            formMessage.className =
              "message error";

          }

        );

      }
    );


  /*
    SAVE FAMILY MEMBER
  */

  document
    .getElementById("saveMemberButton")
    .addEventListener(
      "click",
      async () => {

        const name =
          nameInput.value.trim();

        const relation =
          relationInput.value;

        const phone =
          phoneInput.value.trim();


        if (!name) {

          showError(
            "Please enter the family member's name."
          );

          return;

        }


        if (!relation) {

          showError(
            "Please select the relationship."
          );

          return;

        }


        if (!phone) {

          showError(
            "Please enter the phone number."
          );

          return;

        }


        if (
          selectedLatitude === null ||
          selectedLongitude === null
        ) {

          showError(
            "Please select the home location."
          );

          return;

        }


        try {

          const membersRef =
            ref(
              db,
              `familyMembers/${DEVICE_ID}`
            );


          const newMemberRef =
            push(membersRef);


          const member = {

            name,
            relation,
            phone,

            latitude:
              selectedLatitude,

            longitude:
              selectedLongitude,

            isPrimary:
              false

          };


          await set(
            newMemberRef,
            member
          );


          showSuccess(
            "Family member saved successfully."
          );


          nameInput.value = "";

          relationInput.value = "";

          phoneInput.value = "";

          selectedLatitude = null;

          selectedLongitude = null;

          locationStatus.textContent =
            "No home location selected.";

          locationCoordinates.textContent =
            "";

        }

        catch (error) {

          console.error(
            "Firebase save error:",
            error
          );


          showError(
            "Could not save family member. Check Firebase rules."
          );

        }

      }
    );


  /*
    LOAD FAMILY MEMBERS
  */

  const membersRef =
    ref(
      db,
      `familyMembers/${DEVICE_ID}`
    );


  onValue(
    membersRef,
    (snapshot) => {

      const data =
        snapshot.val();


      renderMembers(
        data
      );

    },

    (error) => {

      console.error(
        "Firebase read error:",
        error
      );


      membersList.innerHTML = `
        <div class="empty">
          Could not load family members.
        </div>
      `;

    }
  );


  /*
    RENDER FAMILY MEMBERS
  */

  function renderMembers(data) {

    if (!data || typeof data !== "object") {

      membersList.innerHTML = `
        <div class="empty">
          No family members added yet.
        </div>
      `;

      return;

    }


    const members =
      Object.entries(data);


    if (members.length === 0) {

      membersList.innerHTML = `
        <div class="empty">
          No family members added yet.
        </div>
      `;

      return;

    }


    membersList.innerHTML =
      members
        .map(
          ([id, member]) => `

            <div
              class="member"
              data-id="${id}"
            >

              <div class="member-header">

                <div class="member-name">
                  👤 ${escapeHtml(member.name)}
                </div>

                ${
                  member.isPrimary
                    ? `
                      <span class="primary-badge">
                        ⭐ PRIMARY CONTACT
                      </span>
                    `
                    : ""
                }

              </div>


              <div class="member-info">

                <div>
                  Relation:
                  ${escapeHtml(member.relation)}
                </div>

                <div>
                  📞
                  ${escapeHtml(member.phone)}
                </div>

                <div>
                  🏠 Home location saved
                </div>

              </div>


              <div class="member-actions">

                ${
                  !member.isPrimary
                    ? `
                      <button
                        class="primary-button"
                        data-primary="${id}"
                      >
                        ⭐ Make Primary
                      </button>
                    `
                    : ""
                }

                <button
                  class="danger-button"
                  data-delete="${id}"
                >
                  Delete
                </button>

              </div>

            </div>

          `
        )
        .join("");


    /*
      DELETE
    */

    document
      .querySelectorAll("[data-delete]")
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            async () => {

              const id =
                button.dataset.delete;


              const confirmed =
                confirm(
                  "Delete this family member?"
                );


              if (!confirmed) {

                return;

              }


              await remove(
                ref(
                  db,
                  `familyMembers/${DEVICE_ID}/${id}`
                )
              );

            }
          );

        }
      );


    /*
      MAKE PRIMARY
    */

    document
      .querySelectorAll("[data-primary]")
      .forEach(
        (button) => {

          button.addEventListener(
            "click",
            async () => {

              const selectedId =
                button.dataset.primary;


              for (
                const [id, member]
                of members
              ) {

                await set(
                  ref(
                    db,
                    `familyMembers/${DEVICE_ID}/${id}/isPrimary`
                  ),
                  id === selectedId
                );

              }


              showSuccess(
                "Primary emergency contact updated."
              );

            }
          );

        }
      );

  }


  function showError(message) {

    formMessage.textContent =
      message;

    formMessage.className =
      "message error";

  }


  function showSuccess(message) {

    formMessage.textContent =
      message;

    formMessage.className =
      "message success";

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
